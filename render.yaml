services:
  - type: web
    name: future50
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: python -m future50 --no-browser --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: F50_MODEL_API_URL
        value: https://integrate.api.nvidia.com/v1
      - key: F50_MODEL_API_KEY
        sync: false
      - key: F50_MODEL_NAME
        value: deepseek-ai/deepseek-v4-flash-0731